name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_selection:
        description: "Select Test Suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - booking-flow
          - custom-pattern
      custom_pattern:
        description: "Custom grep pattern (only if custom-pattern selected above)"
        required: false
        type: string
        default: ""
      enable_video:
        description: "Record video of the run?"
        type: boolean
        default: false

env:
  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Test Selection: ${{ github.event.inputs.test_selection }}"
          echo "Custom Pattern: ${{ github.event.inputs.custom_pattern }}"

      - name: Discover Available E2E Tests
        id: discover-tests
        working-directory: frontend
        run: |
          echo "🔍 Discovering E2E tests..."
          if [ -d "__tests__/e2e" ]; then
            echo "📋 Available E2E test files:"
            find __tests__/e2e -name "*.spec.ts" | sort | while read file; do
              echo "  - $file"
            done
            echo "test_files=$(find __tests__/e2e -name '*.spec.ts' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT
          else
            echo "❌ No __tests__/e2e directory found!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(npm list @playwright/test --depth=0 --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      # Start database for E2E (backend needs MariaDB)
      - name: Start database
        run: docker compose up -d database
        env:
          JWT_SECRET: e2e-test-jwt-secret-at-least-48-characters-long-for-hs384

      - name: Wait for database
        run: |
          for i in {1..20}; do
            if docker compose exec -T database mariadb-admin ping -h localhost -ubooking -pbooking 2>/dev/null; then
              echo "✅ Database is ready!"
              break
            fi
            echo "Waiting for database... ($i/20)"
            sleep 3
          done

      # Start backend
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        working-directory: backend
        run: ./mvnw package -DskipTests -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -B -ntp

      - name: Start backend
        working-directory: backend
        run: |
          java -jar booking-web/target/*-exec.jar \
            --spring.profiles.active=dev \
            --spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/booking \
            --jwt.secret=e2e-test-jwt-secret-at-least-48-characters-long-for-hs384 &
          echo $! > /tmp/backend.pid

          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

      # Build frontend and start preview
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start preview server
        working-directory: frontend
        run: |
          npm run preview -- --port 3000 &
          echo $! > /tmp/frontend.pid

          for i in {1..15}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is ready!"
              break
            fi
            echo "Waiting for frontend... ($i/15)"
            sleep 2
          done

      # Run Playwright tests
      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
          VIDEO_ENABLED: ${{ github.event.inputs.enable_video || 'false' }}
        run: |
          TEST_OPT=""
          SELECTION="${{ github.event.inputs.test_selection }}"
          CUSTOM="${{ github.event.inputs.custom_pattern }}"

          if [ "$SELECTION" = "custom-pattern" ] && [ "$CUSTOM" != "" ]; then
            PATTERN="$CUSTOM"
            echo "🎯 Using custom pattern: $PATTERN"
          elif [ "$SELECTION" != "all" ] && [ "$SELECTION" != "" ]; then
            PATTERN="$SELECTION"
            echo "🎯 Using selected pattern: $PATTERN"
          else
            PATTERN=""
            echo "🚀 Running all E2E tests"
          fi

          if [ "$PATTERN" != "" ]; then
            MATCHING_FILES=$(find __tests__/e2e -name "*.spec.ts" | grep -i "$PATTERN" || true)
            if [ "$MATCHING_FILES" != "" ]; then
              echo "📋 Found matching tests:"
              echo "$MATCHING_FILES"
              TEST_OPT="$PATTERN"
            else
              echo "❌ No tests found matching pattern '$PATTERN'"
              find __tests__/e2e -name "*.spec.ts" | sed 's|__tests__/e2e/||' | sort
              exit 1
            fi
          fi

          echo "🎬 Executing: npx playwright test $TEST_OPT --project=chromium"
          npx playwright test $TEST_OPT --project=chromium

      # Cleanup
      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill $(cat /tmp/frontend.pid) || true
          fi
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
          docker compose down || true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Videos
        if: always() && github.event.inputs.enable_video == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 7

      # Deploy report to GitHub Pages
      - name: Prepare GitHub Pages Deployment
        if: always()
        run: |
          mkdir -p gh-pages/${{ github.run_id }}
          if [ -d "frontend/playwright-report" ]; then
            cp -r frontend/playwright-report/* gh-pages/${{ github.run_id }}/
          fi

          cat > gh-pages/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Test Reports - MUC-DEB Booking Tool</title>
            <style>
              body { font-family: system-ui; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
              h1 { color: #2563eb; }
              .report { border: 1px solid #e5e7eb; padding: 20px; margin: 20px 0; border-radius: 8px; }
              a { color: #2563eb; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .meta { color: #6b7280; font-size: 14px; }
            </style>
          </head>
          <body>
            <h1>🎭 Playwright Test Reports</h1>
            <div class="report">
              <h2><a href="${{ github.run_id }}/index.html">Run #${{ github.run_number }} - $(date -u +"%Y-%m-%d %H:%M UTC")</a></h2>
              <div class="meta">
                <strong>Branch:</strong> ${{ github.ref_name }} |
                <strong>Commit:</strong> <a href="${{ github.event.repository.html_url }}/commit/${{ github.sha }}">${{ github.sha }}</a> |
                <strong>Tests:</strong> ${{ github.event.inputs.test_selection || 'all' }}
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          destination_dir: playwright-reports

      - name: Publish Test Results Summary
        if: always()
        run: |
          echo "### E2E Test Results 🎭" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Selection:** ${{ github.event.inputs.test_selection || 'all' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.test_selection }}" = "custom-pattern" ]; then
            echo "**Custom Pattern:** ${{ github.event.inputs.custom_pattern || 'none' }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Video enabled:** ${{ github.event.inputs.enable_video || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 View Test Report" >> $GITHUB_STEP_SUMMARY
          echo "📦 **[Download Report Artifact](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}#artifacts)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Tests 📋" >> $GITHUB_STEP_SUMMARY
          if [ -d "frontend/__tests__/e2e" ]; then
            find frontend/__tests__/e2e -name "*.spec.ts" | sort | while read file; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
          fi
