name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

env:
  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      packages: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/
            frontend/coverage/
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/coverage/coverage-summary.json';

            if (!fs.existsSync(path)) {
              console.log('Coverage summary not found, skipping PR comment');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = coverage.total;

            const formatPercent = (pct) => `${pct.toFixed(2)}%`;
            const getEmoji = (pct) => pct >= 80 ? '✅' : pct >= 60 ? '⚠️' : '❌';

            const comment = `## 📊 Frontend Coverage Report

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Statements | ${formatPercent(total.statements.pct)} | ${getEmoji(total.statements.pct)} |
            | Branches | ${formatPercent(total.branches.pct)} | ${getEmoji(total.branches.pct)} |
            | Functions | ${formatPercent(total.functions.pct)} | ${getEmoji(total.functions.pct)} |
            | Lines | ${formatPercent(total.lines.pct)} | ${getEmoji(total.lines.pct)} |

            **Overall**: ${formatPercent((total.statements.pct + total.branches.pct + total.functions.pct + total.lines.pct) / 4)}

            <details>
            <summary>📁 View full coverage report</summary>

            Download the \`frontend-coverage-report\` artifact from this workflow run to view the detailed HTML report.
            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Frontend Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Full verify (tests + coverage + quality)
        run: ./mvnw verify -B -V -ntp

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/booking-core/target/site/jacoco-unit-test-report/
            backend/booking-web/target/site/jacoco-unit-test-report/
          retention-days: 7

  docker:
    name: Docker Integration
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: ""

      - name: Start stack
        run: docker compose up -d
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-48-characters-long-for-hs384

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Verify frontend
        run: |
          HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend responding (HTTP $HTTP_CODE)"
          else
            echo "❌ Frontend returned HTTP $HTTP_CODE"
            docker compose logs frontend
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down
