services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    depends_on:
      database:
        condition: service_healthy
    networks:
      - codespaces-network

  database:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: booking
      MARIADB_USER: booking
      MARIADB_PASSWORD: booking
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - codespaces-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-ubooking", "-pbooking"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - codespaces-network

volumes:
  mariadb-data:

networks:
  codespaces-network:
    driver: bridge
