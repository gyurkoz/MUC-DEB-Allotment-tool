# Codespaces profile — inherits from dev, adds Codespaces-specific CORS
spring.datasource.url=jdbc:mariadb://database:3306/booking
spring.datasource.username=booking
spring.datasource.password=booking

jwt.secret=codespaces-dev-jwt-secret-not-for-production-2026

spring.liquibase.contexts=dev

spring.mail.host=mailpit
spring.mail.port=1025

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Allow Codespaces forwarded URLs (*.app.github.dev)
cors.allowed-origin-patterns=https://*.app.github.dev
