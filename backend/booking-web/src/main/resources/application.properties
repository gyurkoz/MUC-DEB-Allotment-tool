spring.docker.compose.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.writer-with-order-by-keys=true

# ISB (Integrated Service Bridge) — Amadeus GDS via SOAP
isb.reservation-endpoint=${ISB_RESERVATION_ENDPOINT:https://isb-test.example.com/IsbReservationService.4.0.0/}
isb.auth-endpoint=${ISB_AUTH_ENDPOINT:https://isb-test.example.com/IsbAuthService.1.1.0/}
